<!DOCTYPE html>  /*A short test on lessons learnt about buttons, css styling and overall html structure*/
<html>  
  <head>
    <style>
      .yellow-button{
        background-color: yellow;
        color: black;
       /* border: none;*/
      }
      .orange-button{
        background-color: orange;
        color: black;
       /* border: none;*/
      }
    </style>
  </head>
  <body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price: $7.99</p>
    <button class="yellow-button" onclick="alert('Added');">Add to cart</button>
    <button class="orange-button" onclick=" console.log('Loading...'); alert('Purchased');">Buy now</button>
  </body>
</html>
